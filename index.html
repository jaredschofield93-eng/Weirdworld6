<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Weird World: home of the short film The Cassette." />
<title>Weird World</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #14121c; --surface: #1e1b2b; --line: #34304a; --text: #ece8f2;
  --muted: #a39db8; --tape: #8fd6c8; --label: #e8c872;
  --serif: 'Fraunces', Georgia, serif; --sans: 'Inter', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
img { max-width: 100%; display: block; }
svg { flex-shrink: 0; }
:focus-visible { outline: 2px solid var(--tape); outline-offset: 3px; }
body.locked { height: 100vh; overflow: hidden; }

/* Intro */
.intro-screen { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem; animation: introOut .5s ease 2.3s forwards; }
.intro-grain { position: absolute; inset: 0; opacity: .08; background-image: radial-gradient(var(--text) 1px, transparent 1px); background-size: 4px 4px; }
.intro-line { position: absolute; top: 50%; height: 1px; width: 30vw; background: var(--tape); opacity: .5; }
.intro-line-left { left: 0; } .intro-line-right { right: 0; }
.intro-logo-wrap { position: relative; width: 140px; height: 140px; display: grid; place-items: center; }
.intro-ring { position: absolute; inset: 0; border: 1px solid var(--tape); border-radius: 50%; animation: spin 6s linear infinite; border-top-color: transparent; }
.intro-logo { width: 100px; height: 100px; object-fit: cover; border-radius: 50%; }
.intro-wordmark { font-family: var(--serif); letter-spacing: .4em; font-size: 1.1rem; }
.intro-skip { color: var(--muted); font-size: .85rem; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
.intro-skip:hover { color: var(--text); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes introOut { to { opacity: 0; visibility: hidden; } }

/* Top bar */
.topbar { position: sticky; top: 0; z-index: 50; background: rgba(20,18,28,.88); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topbar-inner { max-width: 1200px; margin: 0 auto; padding: .75rem 1.25rem; display: flex; align-items: center; gap: 1.5rem; }
.brand img { height: 36px; width: 36px; object-fit: cover; border-radius: 50%; }
.main-nav { display: flex; gap: 1.5rem; font-size: .95rem; color: var(--muted); }
.main-nav a:hover, .main-nav a.active { color: var(--text); }
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: .75rem; }
.search-box { display: flex; align-items: center; gap: .5rem; padding: .45rem .8rem; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
.search-box input { background: none; border: 0; outline: 0; color: var(--text); font: inherit; width: 140px; }
.icon-button { padding: .45rem; border-radius: 50%; color: var(--muted); display: grid; place-items: center; }
.icon-button:hover { color: var(--text); background: var(--surface); }
.mobile-menu { display: none; }

/* Hero */
.hero { position: relative; min-height: 78vh; display: flex; align-items: center; overflow: hidden; border-bottom: 1px solid var(--line); }
.hero-gradient { position: absolute; inset: 0; background: radial-gradient(60% 80% at 80% 40%, rgba(143,214,200,.14), transparent 70%), linear-gradient(120deg, #1b1830, var(--bg)); }
.hero-logo-mark { position: absolute; right: 6%; top: 50%; transform: translateY(-50%); width: min(38vw, 420px); aspect-ratio: 1; object-fit: cover; border-radius: 50%; opacity: .35; }
.hero-content { position: relative; max-width: 1200px; width: 100%; margin: 0 auto; padding: 4rem 1.25rem; }
.hero-kicker { display: flex; align-items: center; gap: .75rem; color: var(--label); font-size: .8rem; letter-spacing: .2em; margin-bottom: 1.25rem; }
.kicker-line { width: 36px; height: 1px; background: var(--label); }
.hero h1 { font-family: var(--serif); font-size: clamp(3.5rem, 11vw, 8rem); line-height: .95; font-weight: 700; }
.hero h1 em { font-weight: 400; color: var(--tape); }
.hero-copy { max-width: 46ch; margin: 1.5rem 0; color: var(--muted); font-size: 1.1rem; }
.hero-details { display: flex; align-items: center; flex-wrap: wrap; gap: .75rem; font-size: .9rem; color: var(--muted); margin-bottom: 1.75rem; }
.hero-details i { width: 3px; height: 3px; border-radius: 50%; background: var(--muted); }
.rated { border: 1px solid var(--muted); padding: 0 .4rem; border-radius: 3px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; }
.primary-button, .secondary-button, .featured-film-action { display: inline-flex; align-items: center; gap: .5rem; padding: .75rem 1.4rem; border-radius: 6px; font-weight: 600; }
.primary-button, .featured-film-action { background: var(--tape); color: #10201d; }
.primary-button:hover, .featured-film-action:hover { filter: brightness(1.08); }
.secondary-button { border: 1px solid var(--line); background: var(--surface); }
.secondary-button:hover { border-color: var(--muted); }
.info-button { padding: .7rem; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; }
.hero-caption { position: absolute; left: 1.25rem; bottom: 1.25rem; display: flex; align-items: center; gap: .4rem; font-size: .8rem; color: var(--muted); }

/* Content */
.content-wrap { max-width: 1200px; margin: 0 auto; padding: 0 1.25rem; }
.content-section { padding: 4rem 0; }
.section-eyebrow { display: block; color: var(--label); font-size: .75rem; letter-spacing: .2em; margin-bottom: .5rem; }
.section-heading h2, .featured-film-copy h2 { font-family: var(--serif); font-size: clamp(1.8rem, 4vw, 2.6rem); }
.film-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.25rem; margin-top: 1.5rem; }
.film-image-wrap { position: relative; display: block; width: 100%; aspect-ratio: 16/10; overflow: hidden; border-radius: 8px; background: var(--surface); }
.film-image { width: 100%; height: 100%; object-fit: cover; }
.film-shade { position: absolute; inset: 0; background: linear-gradient(transparent 50%, rgba(0,0,0,.6)); }
.film-play { position: absolute; left: .75rem; bottom: .75rem; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--tape); color: #10201d; }
.film-duration { position: absolute; right: .75rem; bottom: .75rem; font-size: .75rem; }
.film-meta { padding-top: .6rem; }
.film-meta h3 { font-size: 1rem; }
.film-meta p { font-size: .85rem; color: var(--muted); }
.empty-state { margin-top: 1.5rem; color: var(--muted); }

.featured-film { display: grid; grid-template-columns: 1.4fr 1fr; gap: 2.5rem; align-items: center; }
.featured-film-thumb { aspect-ratio: 16/9; border-radius: 10px; overflow: hidden; background: #000; border: 1px solid var(--line); }
.featured-film-inline-video { width: 100%; height: 100%; border: 0; }
.featured-film-copy p { margin: 1rem 0 1.5rem; color: var(--muted); max-width: 42ch; }

/* Modal */
.video-modal { position: fixed; inset: 0; z-index: 90; background: rgba(8,7,12,.92); display: grid; place-items: center; padding: 1.25rem; }
.video-close { position: absolute; top: 1rem; right: 1rem; padding: .5rem; color: var(--text); }
.video-frame-wrap { width: min(1100px, 100%); aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; }
.video-frame { width: 100%; height: 100%; border: 0; }
.video-poster { position: relative; width: 100%; height: 100%; }
</style>
</head>

    <div class="intro-logo-wrap">
      <div class="intro-ring"></div>
      <!-- Fixed Intro Image Path -->
      <img src="weird-world.png" alt="Weird World Logo" class="intro-logo" />
    </div>
    <div class="intro-wordmark">WEIRD WORLD</div>
    <button class="intro-skip">SKIP INTRO</button>

  <!-- Header Navigation -->
  <header class="topbar">
